name: TRON fee verification
on:
  push:
    branches: [ci/tron-fee-verification]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run project unit tests in its build container
        run: make test
      - name: Build Blockbook
        run: make build
